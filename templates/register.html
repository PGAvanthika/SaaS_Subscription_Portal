{% extends 'base.html' %}

{% block title %}Register - CyberVault{% endblock %}
{% block page_title %}Create CyberVault Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 50px; height: 50px; font-size: 26px;">🛡️</div>
      <h2 style="font-size: 22px; font-weight: 700;">Join CyberVault</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Simulated SaaS Portal Registration</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="user@company.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a strong password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        ✨ Create Free Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
