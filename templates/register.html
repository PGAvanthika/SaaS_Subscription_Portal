{% extends 'base.html' %}

{% block title %}Register - SaaSFlow Enterprise{% endblock %}
{% block page_title %}Create SaaSFlow Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="enterprise-card auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 44px; height: 44px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:24px; height:24px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h2 style="font-size: 20px; font-weight: 700; color: #fff;">Join SaaSFlow Platform</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Initialize Enterprise Account</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="user@company.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a strong password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
